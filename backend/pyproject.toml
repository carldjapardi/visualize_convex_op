[project]
name = "optimization-visualizer-backend"
version = "0.2.0"
description = "FastAPI backend for visualizing convex optimization problems with educational solvers."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "pydantic",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
